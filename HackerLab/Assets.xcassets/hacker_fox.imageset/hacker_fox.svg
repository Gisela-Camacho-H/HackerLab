<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#600099"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>

    <linearGradient id="foxFurDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181328"/>
      <stop offset="100%" stop-color="#0d0918"/>
    </linearGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bf00ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Geometric Tech Background Grid -->
  <g stroke="#bf00ff" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <polygon points="256,40 440,146 440,366 256,472 72,366 72,146" stroke-dasharray="6,6"/>
    <circle cx="256" cy="256" r="190" stroke="#00f0ff" stroke-opacity="0.1"/>
    <!-- Circuit nodes -->
    <path d="M 72,146 L 140,185 M 440,146 L 372,185 M 256,472 L 256,410"/>
    <circle cx="140" cy="185" r="3" fill="#00f0ff"/>
    <circle cx="372" cy="185" r="3" fill="#bf00ff"/>
    <circle cx="256" cy="410" r="3" fill="#00f0ff"/>
  </g>

  <!-- Outer Ears (Fox Sharp Angles) -->
  <g id="ears">
    <!-- Left Ear Outer -->
    <path d="M 175,210 L 100,70 L 230,150 Z" fill="url(#foxFurDark)" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 168,190 L 118,92 L 210,152 Z" fill="url(#cyanGrad)" filter="url(#glowCyan)" opacity="0.8"/>
    
    <!-- Right Ear Outer -->
    <path d="M 337,210 L 412,70 L 282,150 Z" fill="url(#foxFurDark)" stroke="#bf00ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 344,190 L 394,92 L 302,152 Z" fill="url(#purpleGrad)" filter="url(#glowPurple)" opacity="0.8"/>
  </g>

  <!-- Fox Face Structure Base -->
  <g id="fox-head">
    <!-- Main Head Polygon -->
    <path d="M 160,200 L 256,140 L 352,200 L 380,270 L 256,410 L 132,270 Z" fill="#120e24" stroke="#261c47" stroke-width="3"/>

    <!-- Cheek Fur Fluffs (Geometric Sharp) -->
    <path d="M 132,270 L 70,285 L 120,310 L 85,335 L 150,345" fill="#120e24" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M 380,270 L 442,285 L 392,310 L 427,335 L 362,345" fill="#120e24" stroke="#bf00ff" stroke-width="1.5"/>

    <!-- Muzzle / White Inner Fur Area -->
    <path d="M 190,290 L 256,410 L 322,290 L 256,270 Z" fill="#1c1635"/>

    <!-- Black Snout Tip -->
    <polygon points="256,410 242,390 270,390" fill="#00f0ff" filter="url(#glowCyan)"/>

    <!-- Cyber Whiskers -->
    <path d="M 140,320 L 60,315 M 145,335 L 75,345" stroke="#00f0ff" stroke-width="2" opacity="0.8" filter="url(#glowCyan)"/>
    <path d="M 372,320 L 452,315 M 367,335 L 437,345" stroke="#bf00ff" stroke-width="2" opacity="0.8" filter="url(#glowPurple)"/>
  </g>

  <!-- Futuristic Tactical Visor Glasses -->
  <g id="tactical-visor">
    <!-- Visor Main Outer Frame -->
    <polygon points="140,210 256,185 372,210 390,275 256,295 122,275" fill="#080512" stroke="#3d2c6b" stroke-width="4"/>

    <!-- Visor Glass Lens -->
    <polygon points="148,216 256,192 364,216 380,268 256,287 132,268" fill="url(#visorGlass)"/>

    <!-- Matrix Code Overlay Effect inside Visor -->
    <g opacity="0.8" font-family="monospace" font-size="11" font-weight="bold" fill="#00f0ff" filter="url(#glowCyan)">
      <!-- Matrix Rain Columns -->
      <text x="160" y="230" opacity="0.9">101</text>
      <text x="160" y="245" opacity="0.4">01</text>
      <text x="160" y="260" opacity="0.7">1</text>

      <text x="195" y="222" opacity="0.5">0</text>
      <text x="195" y="237" opacity="1.0">1101</text>
      <text x="195" y="252" opacity="0.6">001</text>

      <text x="240" y="215" opacity="0.8">01</text>
      <text x="240" y="230" opacity="0.3">1</text>
      <text x="240" y="245" opacity="0.9">1010</text>

      <text x="280" y="222" opacity="1.0" fill="#bf00ff">1001</text>
      <text x="280" y="237" opacity="0.5" fill="#bf00ff">01</text>

      <text x="325" y="230" opacity="0.7" fill="#bf00ff">011</text>
      <text x="325" y="245" opacity="0.9" fill="#bf00ff">110</text>
    </g>

    <!-- Tactical HUD Crosshair Elements -->
    <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.85" filter="url(#glowCyan)">
      <circle cx="200" cy="240" r="14" stroke-dasharray="8,4"/>
      <circle cx="200" cy="240" r="4" fill="#00f0ff"/>

      <path d="M 300,230 L 330,230 L 330,255" stroke="#bf00ff" stroke-width="2.5" filter="url(#glowPurple)"/>
      <rect x="335" y="226" width="18" height="8" fill="#bf00ff" opacity="0.8"/>
    </g>

    <!-- Glass Glare / Reflection -->
    <polygon points="155,218 210,218 170,278 145,268" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Floating particles / Cyber atmosphere -->
  <g id="particles" opacity="0.8">
    <circle cx="110" cy="180" r="2.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="400" cy="180" r="3" fill="#bf00ff" filter="url(#glowPurple)"/>
    <circle cx="130" cy="390" r="2" fill="#bf00ff" filter="url(#glowPurple)"/>
    <circle cx="380" cy="380" r="2.5" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="256" cy="100" r="2" fill="#00f0ff"/>
  </g>
</svg>
