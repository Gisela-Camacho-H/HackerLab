<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pitch Black Cyberpunk Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#05140b"/>
      <stop offset="100%" stop-color="#000301"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Duck Gradients -->
    <linearGradient id="duckYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="100%" stop-color="#d4aa00"/>
    </linearGradient>

    <linearGradient id="beakOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#b34400"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c17"/>
      <stop offset="100%" stop-color="#060d09"/>
    </linearGradient>

    <linearGradient id="sunglassesGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051a0e"/>
      <stop offset="100%" stop-color="#000502"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Matrix Binary Rain Overlay (Background Layer) -->
  <g font-family="monospace" font-size="12" font-weight="bold" fill="#00ff85" opacity="0.35" filter="url(#glowGreen)">
    <text x="50" y="70">101001</text>
    <text x="50" y="90">010</text>
    <text x="50" y="110">1</text>
    
    <text x="120" y="40">01</text>
    <text x="120" y="60">11010</text>
    
    <text x="220" y="30">1001</text>
    <text x="220" y="50">01</text>
    
    <text x="320" y="40">0110</text>
    <text x="320" y="60">101</text>
    
    <text x="410" y="80">1101</text>
    <text x="410" y="100">00101</text>
    <text x="410" y="120">10</text>

    <text x="80" y="440">0101</text>
    <text x="80" y="460">10110</text>
    
    <text x="380" y="430">10101</text>
    <text x="380" y="450">011</text>
  </g>

  <!-- Hacker Hoodie (Duck Body / Base) -->
  <g id="hoodie">
    <!-- Outer Hood Shoulders -->
    <path d="M 110,480 C 110,380 140,240 256,220 C 372,240 402,380 402,480 Z" fill="url(#hoodieGrad)" stroke="#00ff85" stroke-width="3" filter="url(#glowGreen)"/>
    <!-- Inner Hood Cavity -->
    <path d="M 140,480 C 145,360 170,240 256,240 C 342,240 367,360 372,480 Z" fill="#030805"/>
    <!-- Hood Neon Drawstrings -->
    <path d="M 215,400 Q 200,440 215,470" stroke="#00ff85" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowGreen)"/>
    <path d="M 297,400 Q 312,440 297,470" stroke="#00ff85" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowGreen)"/>
  </g>

  <!-- Rubber Duck Head -->
  <g id="duck-head">
    <!-- Main Yellow Head Shell -->
    <circle cx="256" cy="220" r="90" fill="url(#duckYellow)" stroke="#ffe600" stroke-width="2"/>
    
    <!-- Duck Cheeks Fluff/Curve -->
    <path d="M 170,230 Q 155,250 175,270 Z" fill="url(#duckYellow)"/>
    <path d="M 342,230 Q 357,250 337,270 Z" fill="url(#duckYellow)"/>

    <!-- Duck Orange Beak -->
    <path d="M 210,245 C 210,235 302,235 302,245 C 315,265 295,295 256,295 C 217,295 197,265 210,245 Z" fill="url(#beakOrange)" stroke="#ff4400" stroke-width="2"/>
    <path d="M 218,255 Q 256,265 294,255" stroke="#7a2a00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="242" cy="248" rx="2" ry="4" fill="#521c00"/>
    <ellipse cx="270" cy="248" rx="2" ry="4" fill="#521c00"/>
  </g>

  <!-- Matrix Sunglasses -->
  <g id="matrix-sunglasses">
    <!-- Sleek Angular Sunglasses Frame -->
    <polygon points="160,180 252,185 352,180 365,225 256,240 147,225" fill="#0a0f0c" stroke="#00ff85" stroke-width="3" filter="url(#glowGreen)"/>
    
    <!-- Sunglasses Lenses -->
    <polygon points="166,187 248,191 250,232 155,220" fill="url(#sunglassesGlass)"/>
    <polygon points="256,191 338,187 349,220 254,232" fill="url(#sunglassesGlass)"/>

    <!-- Green Binary Code Reflections in Lenses -->
    <g font-family="monospace" font-size="9" font-weight="bold" fill="#00ff85" opacity="0.85" filter="url(#glowGreen)">
      <text x="175" y="205">101</text>
      <text x="175" y="217">01</text>
      <text x="210" y="202">011</text>
      <text x="210" y="214">10</text>

      <text x="270" y="202">110</text>
      <text x="270" y="214">01</text>
      <text x="305" y="205">01</text>
      <text x="305" y="217">101</text>
    </g>

    <!-- Specular Lens Glare -->
    <polygon points="170,190 205,190 180,222 160,218" fill="#ffffff" opacity="0.25"/>
    <polygon points="260,190 295,190 270,224 255,222" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Foreground Matrix Code Overlay (Crossing the Duck) -->
  <g font-family="monospace" font-size="11" font-weight="bold" fill="#00ff85" opacity="0.75" filter="url(#glowGreen)">
    <text x="130" y="150">01</text>
    <text x="130" y="165">1</text>
    <text x="360" y="140">101</text>
    <text x="360" y="155">0</text>
    <text x="360" y="170">1</text>
  </g>

  <!-- Ambient Floating Digital Sparks -->
  <g id="particles" opacity="0.8">
    <circle cx="100" cy="180" r="2.5" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="410" cy="190" r="3" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="120" cy="360" r="2" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="390" cy="370" r="2.5" fill="#00ff85" filter="url(#glowGreen)"/>
  </g>
</svg>
