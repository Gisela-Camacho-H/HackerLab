<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#b000ff"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff85"/>
      <stop offset="100%" stop-color="#00a859"/>
    </linearGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff85" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00bfff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e29"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Background Cyber Pattern -->
  <g stroke="#00ff85" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="230" stroke-dasharray="4, 8"/>
    <circle cx="256" cy="256" r="210"/>
    <path d="M 256,16 L 256,46 M 256,466 L 256,496 M 16,256 L 46,256 M 466,256 L 496,256"/>
    <!-- Circuit accents -->
    <path d="M 80,120 L 120,120 L 150,150"/>
    <circle cx="80" cy="120" r="3" fill="#00ff85"/>
    <path d="M 432,120 L 392,120 L 362,150"/>
    <circle cx="432" cy="120" r="3" fill="#ff007f"/>
  </g>

  <!-- Hoodie Background / Shoulders -->
  <g>
    <!-- Outer Hood Silhouette -->
    <path d="M 120,480 C 120,380 140,200 256,180 C 372,200 392,380 392,480 Z" fill="url(#hoodieGrad)"/>
    <!-- Hood Rim with Neon Trim -->
    <path d="M 140,480 C 145,350 170,200 256,200 C 342,200 367,350 372,480" fill="none" stroke="#ff007f" stroke-width="5" filter="url(#glowPink)"/>
    <!-- Inner Shadow Hood -->
    <path d="M 155,480 C 160,360 180,220 256,220 C 332,220 352,360 357,480 Z" fill="#06080c"/>
    <!-- Drawstrings -->
    <path d="M 210,380 Q 200,430 215,460" stroke="#00ff85" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowGreen)"/>
    <path d="M 302,380 Q 312,430 297,460" stroke="#00ff85" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glowGreen)"/>
  </g>

  <!-- Cat Ears -->
  <g id="ears">
    <!-- Left Ear -->
    <path d="M 160,220 L 120,100 L 210,170 Z" fill="#121620" stroke="#ff007f" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 155,200 L 132,120 L 190,170 Z" fill="url(#pinkGrad)" filter="url(#glowPink)" opacity="0.8"/>
    
    <!-- Right Ear -->
    <path d="M 352,220 L 392,100 L 302,170 Z" fill="#121620" stroke="#00ff85" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 357,200 L 380,120 L 322,170 Z" fill="url(#greenGrad)" filter="url(#glowGreen)" opacity="0.8"/>
  </g>

  <!-- Cat Head Base -->
  <g id="head">
    <!-- Fur/Face Silhouette -->
    <path d="M 170,220 C 170,170 342,170 342,220 C 352,270 342,340 256,350 C 170,340 160,270 170,220 Z" fill="#1a2130"/>
    
    <!-- Cheeks Fluff (Tufts) -->
    <path d="M 165,260 L 135,270 L 160,285 L 140,300 L 175,305" fill="#1a2130"/>
    <path d="M 347,260 L 377,270 L 352,285 L 372,300 L 337,305" fill="#1a2130"/>

    <!-- Snout & Mouth -->
    <polygon points="256,295 248,285 264,285" fill="#ff007f" filter="url(#glowPink)"/>
    <path d="M 248,302 Q 256,310 256,302 Q 256,310 264,302" stroke="#a0aab8" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Cyber Whiskers -->
    <path d="M 150,290 L 80,280 M 145,300 L 90,305 M 148,310 L 100,328" stroke="#00ff85" stroke-width="2.5" opacity="0.8" filter="url(#glowGreen)"/>
    <path d="M 362,290 L 432,280 M 367,300 L 422,305 M 364,310 L 412,328" stroke="#ff007f" stroke-width="2.5" opacity="0.8" filter="url(#glowPink)"/>
  </g>

  <!-- VR Goggles -->
  <g id="vr-goggles">
    <!-- Main Goggle Frame -->
    <rect x="166" y="205" width="180" height="75" rx="20" fill="#0a0d14" stroke="#2a354d" stroke-width="4"/>
    
    <!-- Visor Glass Lens -->
    <rect x="174" y="213" width="164" height="59" rx="14" fill="url(#visorGlass)"/>
    
    <!-- Glowing Grid / HUD inside Visor -->
    <g opacity="0.6" filter="url(#glowGreen)">
      <line x1="174" y1="242.5" x2="338" y2="242.5" stroke="#00ff85" stroke-width="1.5" stroke-dasharray="6,4"/>
      <circle cx="210" cy="242.5" r="12" stroke="#00ff85" stroke-width="2" fill="none"/>
      <path d="M 290,225 L 320,225 L 320,255" stroke="#ff007f" stroke-width="2" fill="none"/>
      <!-- Digital Cat Pupil Icons in Visor -->
      <polygon points="210,234 214,242.5 210,251 206,242.5" fill="#00ff85"/>
      <polygon points="302,234 306,242.5 302,251 298,242.5" fill="#ff007f"/>
    </g>

    <!-- Top Metallic Strap Connectors -->
    <rect x="236" y="197" width="40" height="10" rx="3" fill="#1a2130" stroke="#00ff85" stroke-width="1.5"/>
    
    <!-- Glass Flare / Glare Effect -->
    <polygon points="185,215 230,215 195,270 180,270" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Neon Headphones -->
  <g id="headphones">
    <!-- Headband Arc -->
    <path d="M 135,230 C 130,120 382,120 377,230" fill="none" stroke="#121620" stroke-width="18" stroke-linecap="round"/>
    <path d="M 140,220 C 138,135 374,135 372,220" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#glowPink)"/>

    <!-- Left Ear Cup -->
    <g>
      <rect x="120" y="210" width="36" height="70" rx="12" fill="#121620" stroke="#00ff85" stroke-width="3" filter="url(#glowGreen)"/>
      <rect x="128" y="222" width="20" height="46" rx="6" fill="#0a0d14"/>
      <!-- LED Ring -->
      <circle cx="138" cy="245" r="10" fill="none" stroke="#00ff85" stroke-width="2.5"/>
      <path d="M 138,235 L 138,255 M 128,245 L 148,245" stroke="#00ff85" stroke-width="2"/>
    </g>

    <!-- Right Ear Cup -->
    <g>
      <rect x="356" y="210" width="36" height="70" rx="12" fill="#121620" stroke="#ff007f" stroke-width="3" filter="url(#glowPink)"/>
      <rect x="364" y="222" width="20" height="46" rx="6" fill="#0a0d14"/>
      <!-- LED Triangle -->
      <polygon points="374,236 384,251 364,251" fill="none" stroke="#ff007f" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Foreground Lighting & Particles -->
  <g id="particles" opacity="0.7">
    <circle cx="120" cy="380" r="2" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="390" cy="360" r="3" fill="#ff007f" filter="url(#glowPink)"/>
    <circle cx="140" cy="160" r="2.5" fill="#ff007f" filter="url(#glowPink)"/>
    <circle cx="370" cy="180" r="2" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="256" cy="120" r="1.5" fill="#00ff85"/>
  </g>
</svg>
