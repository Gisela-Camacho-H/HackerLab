<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pitch Black Cyber Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#05120a"/>
      <stop offset="100%" stop-color="#000301"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Gradients -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff85"/>
      <stop offset="100%" stop-color="#00a857"/>
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff85" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0080ff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="armorDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c17"/>
      <stop offset="100%" stop-color="#080d0a"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Esports Crest Shield / Crest Outer Outline -->
  <g id="esports-crest">
    <!-- Outer Shield Crest Layer -->
    <polygon points="256,35 430,120 400,360 256,475 112,360 82,120" fill="none" stroke="#00ff85" stroke-width="3" stroke-dasharray="10,6" opacity="0.3" filter="url(#glowGreen)"/>
    <polygon points="256,50 415,130 388,350 256,455 124,350 97,130" fill="#090f0b" stroke="#1c2d22" stroke-width="4"/>
  </g>

  <!-- Hood / Cowl Outer Structure -->
  <g id="ninja-hood">
    <!-- Outer Sharp Hood Silhouette -->
    <path d="M 120,230 L 256,70 L 392,230 L 420,380 L 370,410 L 256,450 L 142,410 L 92,380 Z" fill="url(#armorDark)" stroke="#00ff85" stroke-width="3.5" stroke-linejoin="round" filter="url(#glowGreen)"/>

    <!-- Hood Fold Lines / Facets -->
    <g stroke="#00ff85" stroke-width="2" opacity="0.6" fill="none">
      <line x1="256" y1="70" x2="256" y2="160"/>
      <path d="M 256,70 L 190,170 M 256,70 L 322,170"/>
      <path d="M 120,230 L 180,260 M 392,230 L 332,260"/>
    </g>
  </g>

  <!-- Face Mask Shell & Jaw Armor -->
  <g id="ninja-mask">
    <!-- Inner Dark Face Cavity -->
    <polygon points="170,165 256,120 342,165 370,280 256,410 142,280" fill="#030604"/>

    <!-- Sharp Illuminated Cyber Mask Plate -->
    <path d="M 175,270 L 256,230 L 337,270 L 355,330 L 256,400 L 157,330 Z" fill="#0c140e" stroke="#00ff85" stroke-width="3" stroke-linejoin="round"/>

    <!-- Mask Vents / Breathing Slots (Glowing) -->
    <g fill="#00ff85" filter="url(#glowGreen)">
      <!-- Left Vents -->
      <polygon points="200,310 235,295 235,302 205,317"/>
      <polygon points="195,328 235,310 235,317 200,335"/>
      <polygon points="190,346 235,325 235,332 195,353"/>

      <!-- Right Vents -->
      <polygon points="312,310 277,295 277,302 307,317"/>
      <polygon points="317,328 277,310 277,317 312,335"/>
      <polygon points="322,346 277,325 277,332 317,353"/>

      <!-- Center Chin Core -->
      <polygon points="256,350 246,380 266,380"/>
    </g>
  </g>

  <!-- Tactical Visor & Glowing Eyes -->
  <g id="tactical-visor">
    <!-- Visor Outer Frame -->
    <polygon points="160,185 256,150 352,185 365,245 256,265 147,245" fill="#040805" stroke="#00ff85" stroke-width="3.5"/>

    <!-- Glass Lens -->
    <polygon points="168,192 256,158 344,192 355,238 256,256 157,238" fill="url(#visorGrad)" filter="url(#glowGreen)"/>

    <!-- Aggressive Angular Ninja Eye Optics (Inside Visor) -->
    <g fill="#ffffff" filter="url(#glowCyan)">
      <!-- Left Eye -->
      <polygon points="185,205 235,200 225,220 195,218"/>
      <!-- Right Eye -->
      <polygon points="327,205 277,200 287,220 317,218"/>
    </g>

    <!-- Tactical Target Overlay Lines -->
    <g stroke="#00ff85" stroke-width="1.5" fill="none" opacity="0.8">
      <line x1="256" y1="158" x2="256" y2="256"/>
      <circle cx="210" cy="210" r="8" stroke-dasharray="4,2"/>
      <circle cx="302" cy="210" r="8" stroke-dasharray="4,2"/>
    </g>

    <!-- Specular Highlight / Glass Reflection -->
    <polygon points="175,195 225,170 195,235 168,225" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Foreground Cyber Kanji / Crest Accents -->
  <g id="forehead-emblem">
    <!-- Ninja Forehead Plate -->
    <polygon points="226,115 256,100 286,115 276,140 256,145 236,140" fill="#090f0b" stroke="#00ff85" stroke-width="2"/>
    <!-- Glowing Diamond Core -->
    <polygon points="256,110 264,125 256,140 248,125" fill="url(#neonGreenGrad)" filter="url(#glowGreen)"/>
  </g>

  <!-- Ambient Floating Energy Sparks -->
  <g id="particles" opacity="0.85">
    <circle cx="90" cy="180" r="2.5" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="420" cy="170" r="3" fill="#00f0ff" filter="url(#glowCyan)"/>
    <circle cx="110" cy="360" r="2" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="400" cy="370" r="2.5" fill="#00ff85" filter="url(#glowGreen)"/>
    <circle cx="256" cy="45" r="2" fill="#ffffff"/>
  </g>
</svg>
